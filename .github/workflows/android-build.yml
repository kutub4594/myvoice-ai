name: CI - Privacy Guard, Backend Tests & Flutter Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  privacy-audit:
    name: Privacy Safeguard & Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify zero personal voice data, disguised binaries, embeddings, checkpoints, or secrets
        run: python3 scripts/check_staged_privacy.py --tracked

  backend-tests:
    name: Python Backend Unit Tests
    needs: privacy-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install backend core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

  flutter-android-build:
    name: Flutter Tests & Android APK Build
    needs: [privacy-audit, backend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: "stable"
          cache: true

      - name: Ensure Android SDK 35 and 36 platforms are installed
        run: |
          SDK_MANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null || true
            "$SDK_MANAGER" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Ensure Android Gradle wrapper exists
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android "${RUNNER_TEMP}/flutter_tpl"
            cp "${RUNNER_TEMP}/flutter_tpl/android/gradlew" android/gradlew
            cp "${RUNNER_TEMP}/flutter_tpl/android/gradlew.bat" android/gradlew.bat
            cp "${RUNNER_TEMP}/flutter_tpl/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit & widget tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Audit APK archive & output directory for voice/dataset/model leaks
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          if find build/app/outputs/flutter-apk -type f \( -name '*.wav' -o -name '*.mp3' -o -name '*.m4a' -o -name '*.ogg' -o -name '*.flac' -o -name '*.zip' -o -name '*.pt' -o -name '*.safetensors' -o -name '*.ckpt' -o -name '*.npy' -o -name '*.db' \) | grep -q .; then
            echo "Forbidden voice/dataset/model file in APK artifact directory" >&2
            exit 1
          fi
          python3 - <<'PY'
          import sys, zipfile
          bad_exts = ('.wav', '.mp3', '.m4a', '.ogg', '.flac', '.aac', '.opus', '.zip', '.pt', '.pth', '.ckpt', '.safetensors', '.onnx', '.npy', '.npz', '.pkl', '.db', '.sqlite', '.csv')
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as zf:
              bad = [n for n in zf.namelist() if n.lower().endswith(bad_exts) and n != 'assets/AssetManifest.bin']
          if bad:
              print('Forbidden files packaged inside APK:', bad, file=sys.stderr)
              sys.exit(1)
          print('APK archive content audit passed (0 voice/dataset/model entries).')
          PY

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myvoice-ai-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
